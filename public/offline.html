<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0b0c">
    <title>You are offline — Lucy Play</title>
    <link rel="icon" href="/icons/icon-32.png" sizes="32x32" type="image/png">
    <style>
        *{ box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh;
            display: grid; place-items: center; padding: 24px;
            background: #0b0b0c; color: #f4f5f7;
            font-family: 'Urbanist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
            text-align: center; line-height: 1.5;
        }
        .box { max-width: 340px; display: grid; gap: 14px; justify-items: center; }
        img { width: 88px; height: 88px; border-radius: 22px; }
        h1 { margin: 4px 0 0; font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
        p { margin: 0; color: #949aa0; font-size: 13.5px; }
        button {
            margin-top: 6px; min-height: 46px; padding: 0 26px;
            border: 0; border-radius: 13px; cursor: pointer;
            background: linear-gradient(135deg, #08784d, #0ca369);
            color: #fff; font: inherit; font-size: 14px; font-weight: 800;
        }
    </style>
</head>
<body>
    <div class="box">
        <img src="/icons/icon-192.png" alt="Lucy Play">
        <h1>You are offline</h1>
        <p>Your balance and any bet in progress are safe. Reconnect and this page will pick up exactly where it left off.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
