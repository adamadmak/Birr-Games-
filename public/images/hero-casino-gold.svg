<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Casino chips, dice and cards on a dark table">
  <defs>
    <radialGradient id="bg-glow" cx="78%" cy="45%" r="55%">
      <stop offset="0" stop-color="#d9a21f" stop-opacity=".42"/>
      <stop offset=".45" stop-color="#5a430a" stop-opacity=".25"/>
      <stop offset="1" stop-color="#07090a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg-glow2" cx="18%" cy="85%" r="50%">
      <stop offset="0" stop-color="#9d7cff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#07090a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1114"/>
      <stop offset="1" stop-color="#050607"/>
    </linearGradient>
    <linearGradient id="die-face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9e4e8"/>
    </linearGradient>
    <linearGradient id="die-side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9c7cc"/>
      <stop offset="1" stop-color="#7f9096"/>
    </linearGradient>
    <linearGradient id="die-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6fbfc"/>
      <stop offset="1" stop-color="#c9d7db"/>
    </linearGradient>
    <linearGradient id="die-lime-face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d27a"/>
      <stop offset="1" stop-color="#c8961e"/>
    </linearGradient>
    <linearGradient id="die-lime-side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a67a14"/>
      <stop offset="1" stop-color="#6b500a"/>
    </linearGradient>
    <linearGradient id="die-lime-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe7a0"/>
      <stop offset="1" stop-color="#e8b93b"/>
    </linearGradient>
    <linearGradient id="chip-lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ebbd3c"/>
      <stop offset="1" stop-color="#a67a14"/>
    </linearGradient>
    <linearGradient id="chip-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2f34"/>
      <stop offset="1" stop-color="#0f1215"/>
    </linearGradient>
    <linearGradient id="chip-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#c7901a"/>
    </linearGradient>
    <linearGradient id="chip-violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9a4ff"/>
      <stop offset="1" stop-color="#6a4fd6"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3eaee"/>
    </linearGradient>
    <linearGradient id="card-back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2026"/>
      <stop offset="1" stop-color="#0a0d10"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="20" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <clipPath id="card-clip"><rect x="-70" y="-98" width="140" height="196" rx="14"/></clipPath>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#07090a" stop-opacity=".92"/>
      <stop offset=".42" stop-color="#07090a" stop-opacity=".55"/>
      <stop offset=".7" stop-color="#07090a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="720" fill="url(#table)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>
  <rect width="1600" height="720" fill="url(#bg-glow)"/>
  <rect width="1600" height="720" fill="url(#bg-glow2)"/>

  <!-- floor glow under the composition -->
  <ellipse cx="1130" cy="560" rx="420" ry="90" fill="#e0aa2b" fill-opacity=".16" filter="url(#soft)"/>

  <!-- orbit rings -->
  <g fill="none" stroke-width="1.5">
    <circle cx="1130" cy="360" r="300" stroke="#e0aa2b" stroke-opacity=".22"/>
    <circle cx="1130" cy="360" r="222" stroke="#b9a4ff" stroke-opacity=".18" stroke-dasharray="6 14"/>
    <circle cx="1130" cy="360" r="380" stroke="#ffffff" stroke-opacity=".06"/>
  </g>
  <circle cx="830" cy="360" r="6" fill="#f3d27a" filter="url(#glow)"/>
  <circle cx="1352" cy="166" r="5" fill="#ffe08a" filter="url(#glow)"/>
  <circle cx="1390" cy="520" r="4" fill="#b9a4ff" filter="url(#glow)"/>

  <!-- cards fanned behind -->
  <g transform="translate(1010 330) rotate(-18)" filter="url(#shadow)">
    <rect x="-70" y="-98" width="140" height="196" rx="14" fill="url(#card-back)" stroke="#ffffff" stroke-opacity=".16"/>
    <rect x="-56" y="-84" width="112" height="168" rx="9" fill="none" stroke="#e0aa2b" stroke-opacity=".55" stroke-width="2"/>
    <path d="M0-34 L18-6 L0 30 L-18-6Z" fill="#e0aa2b" fill-opacity=".85"/>
  </g>
  <g transform="translate(1060 318) rotate(-4)" filter="url(#shadow)">
    <rect x="-70" y="-98" width="140" height="196" rx="14" fill="url(#card)"/>
    <g clip-path="url(#card-clip)"><rect x="-70" y="-98" width="140" height="196" fill="url(#shine)" opacity=".5" transform="skewX(-20)"/></g>
    <text x="-56" y="-62" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#101417">A</text>
    <path d="M-48-50 l5 10 l-10 0 z" fill="#101417"/>
    <g transform="translate(0 6)">
      <path d="M0-30 C 14-30 26-18 26-6 C 26 10 10 18 0 34 C -10 18 -26 10 -26-6 C -26-18 -14-30 0-30Z" fill="#111519"/>
      <path d="M-5 14 L5 14 L3 40 L-3 40Z" fill="#111519"/>
    </g>
    <text x="56" y="86" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#101417" transform="rotate(180 56 76)">A</text>
  </g>

  <!-- chip stack -->
  <g transform="translate(900 470)" filter="url(#shadow)">
    <g transform="translate(0 44)"><ellipse rx="78" ry="26" fill="#0a0d10"/><ellipse rx="78" ry="26" fill="url(#chip-dark)"/><ellipse rx="56" ry="18" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="3" stroke-dasharray="14 10"/></g>
    <g transform="translate(0 30)"><ellipse rx="78" ry="26" fill="#0a0d10"/><ellipse rx="78" ry="26" fill="url(#chip-violet)"/><ellipse rx="56" ry="18" fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-width="3" stroke-dasharray="14 10"/></g>
    <g transform="translate(0 16)"><ellipse rx="78" ry="26" fill="#0a0d10"/><ellipse rx="78" ry="26" fill="url(#chip-gold)"/><ellipse rx="56" ry="18" fill="none" stroke="#ffffff" stroke-opacity=".6" stroke-width="3" stroke-dasharray="14 10"/></g>
    <g transform="translate(0 2)"><ellipse rx="78" ry="26" fill="#0a0d10"/><ellipse rx="78" ry="26" fill="url(#chip-lime)"/><ellipse rx="56" ry="18" fill="none" stroke="#ffffff" stroke-opacity=".7" stroke-width="3" stroke-dasharray="14 10"/><ellipse rx="34" ry="11" fill="#1c1400" fill-opacity=".55"/><text y="4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#fff1c4" letter-spacing="1">ETB</text></g>
  </g>

  <!-- leaning chip -->
  <g transform="translate(1335 505) rotate(-28)" filter="url(#shadow)">
    <circle r="64" fill="url(#chip-lime)"/>
    <circle r="48" fill="none" stroke="#ffffff" stroke-opacity=".7" stroke-width="4" stroke-dasharray="16 11"/>
    <circle r="30" fill="#1c1400" fill-opacity=".55"/>
    <text y="7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="#fff1c4">5×</text>
  </g>

  <!-- big white die (isometric) -->
  <g transform="translate(1170 400)" filter="url(#shadow)">
    <path d="M-92-36 L0-88 L92-36 L0 16Z" fill="url(#die-top)"/>
    <path d="M-92-36 L0 16 L0 120 L-92 68Z" fill="url(#die-face)"/>
    <path d="M92-36 L0 16 L0 120 L92 68Z" fill="url(#die-side)"/>
    <path d="M-92-36 L0-88 L92-36 L0 16Z M-92-36 L0 16 L0 120 L-92 68Z M92-36 L0 16 L0 120 L92 68Z" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- top: 5 -->
    <g fill="#101417">
      <ellipse cx="0" cy="-36" rx="9" ry="5.5"/>
      <ellipse cx="-46" cy="-36" rx="9" ry="5.5"/><ellipse cx="46" cy="-36" rx="9" ry="5.5"/>
      <ellipse cx="0" cy="-62" rx="9" ry="5.5"/><ellipse cx="0" cy="-10" rx="9" ry="5.5"/>
    </g>
    <!-- left face: 3 -->
    <g fill="#101417">
      <ellipse cx="-46" cy="42" rx="6" ry="8" transform="rotate(30 -46 42)"/>
      <ellipse cx="-70" cy="28" rx="6" ry="8" transform="rotate(30 -70 28)"/>
      <ellipse cx="-22" cy="56" rx="6" ry="8" transform="rotate(30 -22 56)"/>
    </g>
    <!-- right face: 6 -->
    <g fill="#2a343a">
      <ellipse cx="24" cy="36" rx="6" ry="8" transform="rotate(-30 24 36)"/><ellipse cx="68" cy="10" rx="6" ry="8" transform="rotate(-30 68 10)"/>
      <ellipse cx="24" cy="66" rx="6" ry="8" transform="rotate(-30 24 66)"/><ellipse cx="68" cy="40" rx="6" ry="8" transform="rotate(-30 68 40)"/>
      <ellipse cx="24" cy="96" rx="6" ry="8" transform="rotate(-30 24 96)"/><ellipse cx="68" cy="70" rx="6" ry="8" transform="rotate(-30 68 70)"/>
    </g>
  </g>

  <!-- small lime die, tumbling -->
  <g transform="translate(1330 250) rotate(14)" filter="url(#shadow)">
    <g transform="scale(.6)">
      <path d="M-92-36 L0-88 L92-36 L0 16Z" fill="url(#die-lime-top)"/>
      <path d="M-92-36 L0 16 L0 120 L-92 68Z" fill="url(#die-lime-face)"/>
      <path d="M92-36 L0 16 L0 120 L92 68Z" fill="url(#die-lime-side)"/>
      <path d="M-92-36 L0-88 L92-36 L0 16Z M-92-36 L0 16 L0 120 L-92 68Z M92-36 L0 16 L0 120 L92 68Z" fill="none" stroke="#ffffff" stroke-opacity=".4" stroke-width="2" stroke-linejoin="round"/>
      <g fill="#1c1400"><ellipse cx="0" cy="-36" rx="10" ry="6"/></g>
      <g fill="#1c1400"><ellipse cx="-46" cy="42" rx="7" ry="9" transform="rotate(30 -46 42)"/><ellipse cx="-70" cy="28" rx="7" ry="9" transform="rotate(30 -70 28)"/><ellipse cx="-22" cy="56" rx="7" ry="9" transform="rotate(30 -22 56)"/><ellipse cx="-46" cy="14" rx="7" ry="9" transform="rotate(30 -46 14)"/></g>
      <g fill="#1c1400"><ellipse cx="46" cy="40" rx="7" ry="9" transform="rotate(-30 46 40)"/><ellipse cx="46" cy="70" rx="7" ry="9" transform="rotate(-30 46 70)"/></g>
    </g>
  </g>

  <!-- sparkles -->
  <g fill="#ffffff">
    <path d="M980 150 l3 9 9 3 -9 3 -3 9 -3-9 -9-3 9-3z" opacity=".8"/>
    <path d="M1460 330 l2.5 7 7 2.5 -7 2.5 -2.5 7 -2.5-7 -7-2.5 7-2.5z" opacity=".6"/>
    <path d="M1240 600 l2 6 6 2 -6 2 -2 6 -2-6 -6-2 6-2z" opacity=".5"/>
  </g>

  <!-- left-side vignette so copy stays readable -->
  <rect width="1600" height="720" fill="url(#fade)"/>
</svg>
